<app-encabezado></app-encabezado>
<app-barra></app-barra>

<h2>Lo mejor de Play Station</h2>

<div class="store">
  @for (juego of juegos; track juego.id) {
    <div class="card">
       <img [src]="'assets/images/juegos/playstation/' + juego.imagen" [alt]="juego.nombreJuego" class="product-img">
      <h3>{{ juego.nombreJuego }}</h3>
      <p class="console">{{ juego.consola }}</p>
      <p class="price">${{ juego.precio }}</p>
      <span class="warranty">24 MESES DE GARANTÍA</span>
      <button class="cart">🛒</button>
    </div>
  }
</div>

<app-pie></app-pie>
